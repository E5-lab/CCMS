name: Build Android APK

# 构建 CCMS 安卓安装包（Capacitor 把 public/ 打包进 WebView），并以 GitHub Release 发布。
# 触发方式二选一：
#   1. 手动：在 Actions 页面点 “Run workflow”，填入 tag（默认 v0.1.0-apk）
#   2. 推送 tag：git tag apk-v1.0.0 && git push origin apk-v1.0.0
#
# 正式发布请在仓库 Settings → Secrets 配置（缺失时回退为 debug 签名，仍可安装）：
#   SIGNING_KEY_BASE64 : 用 keytool 生成的 release-key.jks 经 base64 后的文本
#   KEY_ALIAS          : 密钥别名（如 ccms）
#   KEY_PASSWORD       : 密钥与 keystore 密码

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name'
        required: true
        default: 'v0.1.0-apk'
  push:
    tags:
      - 'apk-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Accept Android SDK licenses & ensure packages
        # GitHub ubuntu-latest Runner 已预装 Android SDK（$ANDROID_HOME），无需第三方 setup action
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          yes | "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install npm dependencies
        run: npm install

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Copy web assets into native project
        run: npx cap copy android

      - name: Decode signing keystore (if provided)
        if: ${{ env.SIGNING_KEY != '' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: echo "$SIGNING_KEY" | base64 -d > android/release-key.jks

      - name: Build APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$SIGNING_KEY" ]; then
            echo "::notice::使用 Release 签名构建"
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$(pwd)/release-key.jks" \
              -Pandroid.injected.signing.store.password="$KEY_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          else
            echo "::warning::未配置签名密钥，使用 debug 签名（assembleDebug），APK 仍可安装"
            ./gradlew assembleDebug
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android -name '*.apk' \( -path '*release*' -o -path '*debug*' \) | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: CCMS Android ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
