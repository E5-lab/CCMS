name = "ccms"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# 静态资源（单页应用）由 Cloudflare 边缘托管
assets = { directory = "public", not_found_handling = "single-page-application" }

# 主动还款提醒（Cron）：每天 09:00 触发，需配合 VAPID 环境变量（见下）
# 注：通过 Git 构建部署时，Cron 也可在后台 Workers → ccms → Settings → Triggers 中设置。
[triggers]
crons = ["0 9 * * *"]

# Cloudflare D1 数据库（多设备同步 / 账号 / 推送）
# ★ 默认不启用：wrangler 不会在 toml 里做 ${VAR} 环境变量替换，写占位符会导致
#   Cloudflare Git 构建部署失败（code 10021: must have a valid 'database_id'）。
#   因此仓库中不放 D1 绑定 —— 部署成功后，在后台手动绑定一次即可（绑定永久保留，
#   后续 Git 部署不会丢失，无需重复操作）：
#
#   Workers & Pages → ccms → 设置(Settings) → 绑定(Bindings) → 添加 → D1 数据库
#     变量名称(Variable name)：DB
#     D1 数据库：选择 ccms（没有就先到 存储和数据 → D1 → 创建数据库，名字 ccms）
#   保存后无需重新部署，Worker 会在首次访问时自动建全部表，无需执行任何 SQL。
#
# 若用本地 CLI 部署（npm run setup:d1），脚本会自动把下面整段（填好真实 ID）追加到本文件末尾：
# [[d1_databases]]
# binding = "DB"
# database_name = "ccms"
# database_id = "<你的数据库ID>"

# Web Push（还款提醒）环境变量：在后台 Workers → ccms → Settings → Variables & Secrets 中添加
#   VAPID_PUBLIC_KEY  : 用 `npx web-push generate-vapid-keys` 生成的 public key（base64url）
#   VAPID_PRIVATE_KEY : 同上生成的 private key（base64url）
# 未配置时，Cron 会跳过推送（不影响其它功能）。
#
# 已为你预生成一对可用的 VAPID 密钥（直接填到上面的两个变量即可；也可自建）：
#   VAPID_PUBLIC_KEY  : 前端 index.html 已内置与之配对的公钥（字节数组形式，运行时还原），服务端发送推送时需与本变量一致；可运行 npx web-push generate-vapid-keys 自建并同步替换 index.html 中的数组。
#   VAPID_PRIVATE_KEY = <与公钥配对的私钥；请在后台 Variables & Secrets 配置，切勿提交到仓库>
# 注：前端 index.html 已内置上述公钥（window.VAPID_PUBLIC）用于浏览器订阅；服务端真正发送推送时需这两个环境变量齐全。
