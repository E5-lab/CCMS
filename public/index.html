<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CCMS · 信用卡账单管理</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CCMS" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">💳</span>
        <span class="brand-name">CCMS</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">概览</button>
        <button class="nav-item" data-view="cards">信用卡</button>
        <button class="nav-item" data-view="closed">已注销</button>
        <button class="nav-item" data-view="monthly">月度账单</button>
        <button class="nav-item" data-view="annual">年度汇总</button>
        <button class="nav-item" data-view="history">历年汇总</button>
        <button class="nav-item" data-view="settings">设置</button>
      </nav>
      <div class="sidebar-foot">
        <div id="syncState" class="sync-state">本地存储</div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1 id="pageTitle">概览</h1>
        <div id="topActions" class="top-actions"></div>
        <div id="accountArea" class="account-area"></div>
      </header>
      <section id="viewRoot" class="view-root"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <!-- Web Push 公钥（VAPID）：用于浏览器订阅还款提醒。私钥在 Worker 环境变量 VAPID_PRIVATE_KEY 中配置。 -->
  <script>window.VAPID_PUBLIC = "BBZlC1P0Ktdnq4tdOtLyoKlLNgHavp7Vt571etvciqgr_JBYzwhX6BmMWue2oIP4RtGtzjbTF1h1sivi5hWNJxQ";</script>
  <script src="./app.js"></script>
</body>
</html>
