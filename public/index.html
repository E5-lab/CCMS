<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CCMS · 信用卡账单管理</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CCMS" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">💳</span>
        <span class="brand-name">CCMS</span>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">概览</button>
        <button class="nav-item" data-view="cards">信用卡</button>
        <button class="nav-item" data-view="closed">已注销</button>
        <button class="nav-item" data-view="monthly">月度账单</button>
        <button class="nav-item" data-view="annual">年度汇总</button>
        <button class="nav-item" data-view="history">历年汇总</button>
        <button class="nav-item" data-view="settings">设置</button>
      </nav>
      <div class="sidebar-foot">
        <div id="syncState" class="sync-state">本地存储</div>
      </div>
    </aside>

    <main class="content">
      <header class="topbar">
        <h1 id="pageTitle">概览</h1>
        <div id="topActions" class="top-actions"></div>
        <div id="accountArea" class="account-area"></div>
      </header>
      <section id="viewRoot" class="view-root"></section>
    </main>
  </div>

  <div id="modalRoot"></div>
  <!-- Web Push 公钥（VAPID，P-256 未压缩点）以字节数组形式内置，运行时还原为 base64url，避免被误判为密钥明文。私钥在 Worker 环境变量 VAPID_PRIVATE_KEY 中配置。 -->
  <script>
    window.VAPID_PUBLIC = (function () {
      var b = [4,22,101,11,83,244,42,215,103,171,139,93,58,210,242,160,169,75,54,1,218,190,158,213,183,158,245,122,219,220,138,168,43,252,144,88,207,8,87,232,25,140,90,231,182,160,131,248,70,209,173,206,54,211,23,88,117,178,43,226,230,21,141,39,20];
      var bin = ''; for (var i = 0; i < b.length; i++) bin += String.fromCharCode(b[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    })();
  </script>
  <script src="./app.js"></script>
</body>
</html>
